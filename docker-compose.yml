# Local development infrastructure for the API. Every port binds to 127.0.0.1 only.
# Reads api/.env for secrets. Usage (from api/): npm run keys:generate && npm run infra:up
name: makeen

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-makeen_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run npm run keys:generate}
      POSTGRES_DB: ${POSTGRES_DB:-makeen}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?run npm run keys:generate}
      - --appendonly
      - 'yes'
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '127.0.0.1:${SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

  # S3-compatible private object store for uploads (DECISIONS D-03). Bucket is private; no anonymous access.
  s3:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    command: >
      server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-makeen-dev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run npm run keys:generate}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<EOF
        {"identities":[{"name":"makeen-api","credentials":[{"accessKey":"$${S3_ACCESS_KEY_ID}","secretKey":"$${S3_SECRET_ACCESS_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec /entrypoint.sh "$$@"
      - --
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - s3data:/data

volumes:
  pgdata:
  redisdata:
  s3data:
