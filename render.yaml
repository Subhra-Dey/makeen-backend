databases:
  - name: makeen-postgres
    databaseName: makeen
    user: makeen
    plan: free
    postgresMajorVersion: "16"

services:
  # 1. Redis Key-Value Store
  - type: keyvalue
    name: makeen-redis
    plan: free
    ipAllowList: []

  # 2. NestJS Backend API
  - type: web
    name: makeen-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: API_PORT
        value: 10000
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: makeen-postgres
          property: connectionString
      - key: MIGRATE_DATABASE_URL
        fromDatabase:
          name: makeen-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: makeen-redis
          property: connectionString
      - key: WEB_ORIGIN
        # Public URL of the frontend (e.g. https://makeen-frontend.onrender.com or https://makeen-frontend.vercel.app)
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: SWAGGER_ENABLED
        value: "true"
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: ./var/uploads
      - key: EMAIL_PROVIDER
        value: console
      - key: SMS_PROVIDER
        value: console
      - key: JOBS_ENABLED
        value: "true"
      - key: NOTICE_DAILY_AT
        value: "07:00"
      - key: JWT_PRIVATE_KEY_B64
